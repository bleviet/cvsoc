# OpenOCD configuration for DE10-Nano HPS (Cyclone V SoC) — USB Blaster II direct driver.
#
# Unlike de10_nano_hps.cfg (which uses Intel's aji_client interface via jtagd),
# this file uses the standard usb_blaster driver with the ublast2 low-level
# backend. This allows direct DP/AP recovery when OS lock is set.

adapter driver usb_blaster
usb_blaster_vid_pid 0x09fb 0x6010 0x09fb 0x6810
usb_blaster_lowlevel_driver ublast2

if { [info exists BLASTER_FW] } {
    usb_blaster_firmware $BLASTER_FW
} else {
    usb_blaster_firmware /opt/intelFPGA/quartus/linux64/blaster_6810.hex
}

adapter speed 1000

# Physical scan order for usb_blaster on DE10-Nano is FPGA then CPU.
jtag newtap fpgasoc.fpga tap -irlen 10 -ircapture 0x01 -irmask 0x3 \
    -expected-id 0x02d020dd
jtag newtap fpgasoc cpu -irlen 4 -ircapture 0x01 -irmask 0x0f \
    -expected-id 0x4ba00477

dap create fpgasoc.dap -chain-position fpgasoc.cpu
target create fpgasoc.cpu.0 cortex_a -dap fpgasoc.dap \
    -coreid 0 -dbgbase 0x80110000

fpgasoc.cpu.0 configure -defer-examine

# Prepare CPU0 for OCRAM load/run:
# 1) stop polling, 2) clear DP sticky flags, 3) unlock OS lock, 4) examine,
# 5) enable debug, 6) halt, 7) disable MMU/caches for raw OCRAM access.
proc fpgasoc_prepare_ocram_exec {} {
    poll off
    set last_err ""
    set examined 0
    for {set i 0} {$i < 5} {incr i} {
        catch { fpgasoc.dap dpreg 0x0 0x1f }           ;# ABORT: clear sticky bits
        catch { fpgasoc.dap dpreg 0x4 0x50000000 }     ;# CTRL/STAT: req sys+dbg power-up
        catch { fpgasoc.dap apreg 0 0x0 0x00000002 }   ;# CSW: 32-bit transfer
        catch { fpgasoc.dap apreg 0 0x4 0x80110300 }   ;# TAR: DBGOSLAR
        catch { fpgasoc.dap apreg 0 0xC 0x00000000 }   ;# DRW: clear OS lock
        if {[catch { fpgasoc.cpu.0 arp_examine } err] == 0} {
            set examined 1
            break
        }
        set last_err $err
    }
    if {!$examined} {
        error "Could not examine target after retries: $last_err"
    }
    catch { cortex_a dbginit }
    halt
    arm mcr 15 0 1 0 0 0x00C50078
}

gdb_port 3333
telnet_port 4444
tcl_port 6666
