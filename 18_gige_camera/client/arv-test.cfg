# arv-test configuration for the cvsoc DE10-Nano GigE camera.
#
#   arv-test-0.8 -c client/arv-test.cfg -n cvsoc
#
# M1 acceptance: Aravis's generic test suite (Genicam schema validation,
# properties, acquisition, GigE Vision checks). Features the camera does not
# have yet are declared unsupported so the remaining tests are meaningful;
# each one is enabled by the milestone that adds it.
#
# Frame rates are chosen for a receiver that sustains ~270 Mbit/s (the
# current lab adapter, ADR-001); full-res Bayer8 needs ~40 Mbit/s per fps.

[cvsoc:DE10-Nano GigE Camera]

# The camera's XML uses GenApi schema 1.1. arv-test 0.8.30 loads the 1.0 schema
# for both its 1.0 and 1.1 checks, so a 1.1 document can never pass there.
# Schema validation runs in client/test_camd.py instead (GenApi 1.1 XSD).
Schema=Invalid
SensorSize=2592;1944

# M2: exposure and gain need the sensor.
GainAvailable=false
ExposureTimeAvailable=false

# M3: triggers and chunk data.
SoftwareTriggerSupport=false
ChunksSupport=false

# Not planned for v1.0.
Multipart=false

# arv-test waits 500 ms for each buffer after the first, so rates must stay
# well above 2 Hz.
FrameRateA=3
FrameRateB=2.5
