# OpenOCD configuration for DE10-Nano HPS (Cyclone V SoC) — USB Blaster II direct driver.
#
# Unlike de10_nano_hps.cfg (which uses Intel's aji_client interface via jtagd),
# this file uses the standard usb_blaster driver with the ublast2 low-level
# backend.  This lets OpenOCD talk directly to the USB Blaster II hardware
# without going through jtagd, which is important for two reasons:
#
#   1. jtagd is not needed (simpler invocation, one fewer process to manage).
#   2. The aji_client driver maintains internal connection state that it does
#      NOT reset when the DP ABORT register is written to clear STICKY ERROR.
#      After STICKY ERROR the aji_client driver refuses further AP register
#      access, making OS-Lock recovery impossible from TCL -c commands.
#      The usb_blaster driver does not have this limitation.
#
# Usage (via Makefile):
#   make download-elf                  # see Makefile download-elf target
#
# Usage standalone (WSL2 host, openocd ≥ 0.11.0, after usbipd attach):
#   openocd \
#     -c "set BLASTER_FW /path/to/blaster_6810.hex" \
#     -f scripts/de10_nano_hps_ublast2.cfg \
#     -c "init" -c "halt" -c "shutdown"
#
# Firmware path: override at runtime with -c "set BLASTER_FW /path/to/hex"
# before -f.  Falls back to the path used inside the cvsoc/quartus:23.1
# Docker image.

# ── Interface: USB Blaster II (direct, no jtagd) ──────────────────────────────
adapter driver usb_blaster
usb_blaster_vid_pid 0x09fb 0x6010 0x09fb 0x6810
usb_blaster_lowlevel_driver ublast2

if { [info exists BLASTER_FW] } {
    usb_blaster_firmware $BLASTER_FW
} else {
    usb_blaster_firmware /opt/intelFPGA/quartus/linux64/blaster_6810.hex
}

adapter speed 1000

# ── Cyclone V SoC JTAG chain ──────────────────────────────────────────────────
# Physical scan order (TDI → TDO) with the usb_blaster driver on DE10-Nano:
#   Device @1: Cyclone V FPGA TAP  (irlen 10)   ← closer to TDI
#   Device @2: HPS ARM DAP         (irlen 4)    ← closer to TDO
#
# NOTE: The Intel aji_client driver (used by de10_nano_hps.cfg) presents the
# chain in the REVERSE order.  Do not mix up the two configs.
jtag newtap fpgasoc.fpga tap -irlen 10 -ircapture 0x01 -irmask 0x3 \
    -expected-id 0x02d020dd
jtag newtap fpgasoc cpu -irlen 4 -ircapture 0x01 -irmask 0x0f \
    -expected-id 0x4ba00477

# ── Cortex-A9 core 0 ─────────────────────────────────────────────────────────
dap create fpgasoc.dap -chain-position fpgasoc.cpu
target create fpgasoc.cpu.0 cortex_a -dap fpgasoc.dap \
    -coreid 0 -dbgbase 0x80110000

fpgasoc.cpu.0 configure -event reset-assert-post {
    cortex_a dbginit
}

# GDB server on default port 3333
gdb_port 3333
telnet_port 4444
tcl_port 6666
# Disable polling to prevent STICKY ERROR from background DBGDSCR reads
