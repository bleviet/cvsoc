# OpenOCD configuration for DE10-Nano HPS (Cyclone V SoC, Cortex-A9).
#
# Connects via USB-Blaster II using Intel's aji_client interface (talks to
# jtagd daemon).  Start jtagd before invoking openocd (see Makefile).
#
# Usage via Makefile (Docker):
#   make download-elf
#
# Troubleshooting JTAG-DP STICKY ERROR:
#   This error means the ARM DAP saw a WAIT timeout on a previous access and
#   latched a sticky error bit.  It persists across OpenOCD sessions if jtagd
#   keeps the JTAG connection open.  To clear it:
#     1. Power-cycle the DE10-Nano board (cold reset).
#     2. Let U-Boot reach its idle prompt (confirms DDR3 is initialised).
#     3. Then run: make program-sof && make download-elf
#   Do NOT run download-elf immediately after a failed attempt without
#   power-cycling; the sticky bit will still be set in the DAP.

# ── Interface: aji_client ─────────────────────────────────────────────────────
# Intel's Quartus-bundled OpenOCD uses aji_client (talks to jtagd daemon).
# Note: aji_client ignores adapter speed — the setting below has no effect.
interface aji_client

adapter speed 1000

# ── Cyclone V SoC JTAG chain ──────────────────────────────────────────────────
# Device @1: HPS ARM DAP  (irlen 4)
# Device @2: Cyclone V FPGA TAP (irlen 10)
jtag newtap fpgasoc cpu -irlen 4 -ircapture 0x01 -irmask 0x0f \
    -expected-id 0x4ba00477
jtag newtap fpgasoc.fpga tap -irlen 10 -ircapture 0x01 -irmask 0x3 \
    -expected-id 0x02d020dd

# ── Cortex-A9 core 0 ─────────────────────────────────────────────────────────
dap create fpgasoc.dap -chain-position fpgasoc.cpu
target create fpgasoc.cpu.0 cortex_a -dap fpgasoc.dap \
    -coreid 0 -dbgbase 0x80110000

fpgasoc.cpu.0 configure -event reset-assert-post {
    cortex_a dbginit
}

# GDB server on default port 3333
gdb_port 3333
telnet_port 4444
tcl_port 6666
